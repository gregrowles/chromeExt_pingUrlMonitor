<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Ping Monitor</title>
  <script src="./popper.min.js"></script>
  <script src="./tippy.umd.min.js"></script>
  <script src="./sha256.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">URL Ping Monitor</h1>
      <p class="app-subtitle">Monitor your URLs and get notified when they go offline</p>
    </header>

    <!-- URL List Section -->
    <section 
      id="tab-monitored" 
      data-tab="monitored" 
      class="tab-panel card"
    >
      <h2 class="section-title">Monitored URLs</h2>
      <div id="urlList" class="url-list">
          <!-- URLs will be dynamically added here -->
      </div>
      <div id="emptyState" class="empty-state">
          <p>No URLs added yet. Add a URL to start monitoring.</p>
      </div>
    </section>
    
    <!-- Settings Section -->
    <section 
      id="tab-settings" 
      data-tab="settings" 
      class="tab-panel card hidden"
    >
      <h2 class="section-title">Settings</h2>
      
      <div class="setting-row">
        <label class="setting-label" for="pingInterval">Ping Interval (seconds):</label>
        <div class="input-with-button">
          <input 
            type="number" 
            id="pingInterval" 
            min="5" 
            value="30" 
            class="input-number"
          />
          <button 
            id="saveInterval" 
            class="btn btn-primary"
          >
            Save
          </button>
        </div>
      </div>

      <div class="settings-checkboxes">
        <label class="checkbox-label">
          <input 
            type="checkbox" 
            id="hideLauncherToggle" 
            class="checkbox-input"
          />
          <div class="checkbox-text">
            <span class="checkbox-title">Hide floating button when minimized</span>
            <p class="checkbox-desc">
              Remove the on-page launcher pill. You can still reopen the floating panel by re-enabling this option.
            </p>
          </div>
        </label>
        
        <label class="checkbox-label">
          <input 
            type="checkbox" 
            id="notificationsToggle" 
            class="checkbox-input"
          />
          <div class="checkbox-text">
            <span class="checkbox-title">Enable offline notifications</span>
            <p class="checkbox-desc">
              Receive a browser notification whenever a monitored URL goes offline.
            </p>
          </div>
        </label>
      </div>
    </section>

    <!-- Add URL Section -->
    <section 
      id="tab-add" 
      data-tab="add" 
      class="tab-panel card hidden"
    >
      <h2 class="section-title">Add URL</h2>
      <div class="form-container">
        <div class="form-field">
          <label class="form-label" for="newAlias">Alias (optional)</label>
          <input 
            type="text"
            id="newAlias"
            placeholder="site / domain"
            class="input-text"
          />
        </div>
        
        <div class="form-field">
          <label class="form-label" for="newGroup">Priority / Group (optional)</label>
          <input 
            type="text"
            id="newGroup"
            placeholder="Client A · Critical · Prod"
            class="input-text"
          />
          <p class="field-desc">Use any label to categorize this URL (client, environment, severity, etc.).</p>
        </div>
        
        <div class="form-row-submit">
          <div class="form-field url-field">
            <label class="form-label" for="newUrl">URL</label>
            <input 
              type="url" 
              id="newUrl" 
              placeholder="https://example.com" 
              class="input-text"
            />
          </div>
          <button 
            id="addUrl" 
            class="btn btn-success"
          >
            Add
          </button>
        </div>
      </div>
    </section>

    <!-- Tab Navigation -->
    <nav class="tab-navigation">
      <button 
        type="button" 
        class="tab-button"
        data-tab-target="monitored"
      >
        Monitored URLs
      </button>
      <button 
        type="button" 
        class="tab-button"
        data-tab-target="settings"
      >
        Settings
      </button>
      <button 
        type="button" 
        class="tab-button"
        data-tab-target="add"
      >
        Add New
      </button>
    </nav>

  </div>

  <script src="popup.js"></script>
</body>
</html>
